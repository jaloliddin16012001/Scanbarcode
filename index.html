<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Skaner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg: #0B0E12;
    --surface: #12161C;
    --surface-2: #171C24;
    --line: #232A33;
    --text: #EDF1F5;
    --muted: #7C8794;
    --laser: #33E6A0;
    --error: #F0664D;
    --amber: #E8B93F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .top h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .top .count {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .viewfinder {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    aspect-ratio: 3 / 4;
  }
  #reader { width: 100% !important; height: 100% !important; }
  #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--laser);
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
  }
  .corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  /* Fanarqi tugmasi */
  .torch-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(11,14,18,0.65);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
  }
  .torch-btn svg { width: 19px; height: 19px; stroke: var(--muted); fill: none; }
  .torch-btn.on { background: var(--amber); border-color: var(--amber); }
  .torch-btn.on svg { stroke: #241a04; fill: #241a04; }
  .torch-btn.hidden { display: none; }

  .status {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 22px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status.saved .dot { background: var(--laser); }
  .status.error .dot { background: var(--error); }
  .status.saved span.msg { color: var(--text); }

  .history { margin-top: 22px; }
  .history h2 {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row .code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .meta {
    font-size: 11.5px;
    color: var(--muted);
    flex-shrink: 0;
    text-align: right;
  }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .tag.kirim { background: rgba(51,230,160,0.15); color: var(--laser); }
  .tag.chiqim { background: rgba(240,102,77,0.15); color: #F0906D; }
  .empty {
    color: var(--muted);
    font-size: 13.5px;
    padding: 10px 0;
  }

  .setup-warning {
    background: #2A1414;
    border: 1px solid #4A2020;
    color: #F0A090;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .setup-warning code {
    background: #1A0D0D;
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* ===== Pastki tasdiqlash oynasi ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 50;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(.32,.72,0,1);
    z-index: 51;
    max-width: 480px;
    margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 6px auto 16px;
  }
  .sheet .label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sheet .scanned-code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 18px;
    font-weight: 600;
    word-break: break-all;
    margin-bottom: 4px;
  }
  .sheet .scanned-format {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  /* Kirim / Chiqim tanlovi */
  .type-row { margin-bottom: 18px; }
  .type-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
  }
  .type-toggle button {
    flex: 1;
    padding: 11px 0;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }
  .type-toggle button.active.chiqim { background: var(--error); color: #fff; }
  .type-toggle button.active.kirim { background: var(--laser); color: #08130D; }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .qty-row .label { margin-bottom: 0; font-size: 14px; color: var(--text); }
  .qty-control {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .qty-control button {
    width: 42px; height: 42px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 20px;
    line-height: 1;
  }
  .qty-control input {
    width: 52px;
    height: 42px;
    text-align: center;
    background: transparent;
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .qty-control input::-webkit-outer-spin-button,
  .qty-control input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .sheet-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .btn-cancel {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--line);
    flex: 0 0 auto;
    padding: 14px 18px;
  }
  .btn-send { background: var(--laser); color: #08130D; }
  .btn-send:active { opacity: 0.85; }
  .btn-send:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Skaner</h1>
      <span class="count" id="count">0 ta kod</span>
    </div>

    <div id="setupWarning"></div>

    <div class="viewfinder">
      <div id="reader"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <button type="button" class="torch-btn hidden" id="torchBtn" aria-label="Fanarqi">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/>
        </svg>
      </button>
    </div>

    <div class="status" id="status">
      <div class="dot"></div>
      <span class="msg">Kodni ramka ichiga tuting</span>
    </div>

    <div class="history">
      <h2>Yuborilgan kodlar</h2>
      <div id="log"><div class="empty">Hali hech narsa yuborilmadi</div></div>
    </div>
  </div>

  <!-- Pastki tasdiqlash oynasi -->
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="label">Skanerlangan kod</div>
    <div class="scanned-code" id="sheetCode">—</div>
    <div class="scanned-format" id="sheetFormat">&nbsp;</div>

    <div class="type-row">
      <div class="type-toggle">
        <button type="button" id="btnKirim" data-type="kirim">Kirim</button>
        <button type="button" id="btnChiqim" data-type="chiqim" class="active chiqim">Chiqim</button>
      </div>
    </div>

    <div class="qty-row">
      <div class="label">Soni</div>
      <div class="qty-control">
        <button type="button" id="qtyMinus">−</button>
        <input type="number" id="qtyInput" value="1" min="1" inputmode="numeric">
        <button type="button" id="qtyPlus">+</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCancel">Bekor qilish</button>
      <button class="btn btn-send" id="btnSend">Yuborish</button>
    </div>
  </div>

<script>
  // ====== SHUNI O'ZGARTIRING ======
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzE5qF4vST5KKlwOIM46p_qFlnJjR9sxcSf8jTvGt4VT6aP32HDqLDP0_5pygBMr_RX0Q/exec";
  // =================================

  let count = 0;
  let sheetOpen = false;
  let pendingCode = "";
  let pendingFormat = "";
  let selectedType = "chiqim"; // standart holat: Chiqim
  let torchOn = false;
  let torchSupported = false;
  let html5QrCode = null;

  const statusEl = document.getElementById('status');
  const statusMsg = statusEl.querySelector('.msg');
  const logEl = document.getElementById('log');
  const countEl = document.getElementById('count');

  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const sheetCode = document.getElementById('sheetCode');
  const sheetFormat = document.getElementById('sheetFormat');
  const qtyInput = document.getElementById('qtyInput');
  const btnSend = document.getElementById('btnSend');
  const btnKirim = document.getElementById('btnKirim');
  const btnChiqim = document.getElementById('btnChiqim');
  const torchBtn = document.getElementById('torchBtn');

  if (APPS_SCRIPT_URL.indexOf('YOUR_APPS_SCRIPT') !== -1) {
    document.getElementById('setupWarning').innerHTML =
      '<div class="setup-warning">Sozlash tugallanmagan: index.html faylida <code>APPS_SCRIPT_URL</code> qiymatini o\'zingizning Apps Script /exec havolangizga almashtiring.</div>';
  }

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusMsg.textContent = text;
  }

  // ---- Kirim/Chiqim tanlovi ----
  function setType(type) {
    selectedType = type;
    btnKirim.classList.toggle('active', type === 'kirim');
    btnKirim.classList.toggle('kirim', type === 'kirim');
    btnChiqim.classList.toggle('active', type === 'chiqim');
    btnChiqim.classList.toggle('chiqim', type === 'chiqim');
  }
  btnKirim.addEventListener('click', function () { setType('kirim'); });
  btnChiqim.addEventListener('click', function () { setType('chiqim'); });

  // ---- Pastki oyna ----
  function openSheet() {
    sheetOpen = true;
    sheetCode.textContent = pendingCode;
    sheetFormat.textContent = pendingFormat || '\u00A0';
    qtyInput.value = 1;
    setType('chiqim'); // har safar standart holatga qaytadi
    overlay.classList.add('open');
    sheet.classList.add('open');
    if (html5QrCode) html5QrCode.pause(true);
  }

  function closeSheet() {
    sheetOpen = false;
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    if (html5QrCode) html5QrCode.resume();
  }

  document.getElementById('btnCancel').addEventListener('click', closeSheet);
  overlay.addEventListener('click', closeSheet);

  document.getElementById('qtyMinus').addEventListener('click', function () {
    qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);
  });
  document.getElementById('qtyPlus').addEventListener('click', function () {
    qtyInput.value = (parseInt(qtyInput.value, 10) || 1) + 1;
  });

  btnSend.addEventListener('click', function () {
    const quantity = Math.max(1, parseInt(qtyInput.value, 10) || 1);
    btnSend.disabled = true;
    btnSend.textContent = 'Yuborilmoqda...';

    sendToSheet(pendingCode, pendingFormat, quantity, selectedType, function () {
      btnSend.disabled = false;
      btnSend.textContent = 'Yuborish';
      closeSheet();
    });
  });

  // ---- Google Sheetsga yuborish (GET so'rov, POST emas) ----
  function sendToSheet(code, format, quantity, type, done) {
    const params = new URLSearchParams({ code: code, format: format, quantity: quantity, type: type });
    const url = APPS_SCRIPT_URL + '?' + params.toString();

    fetch(url, { method: 'GET', mode: 'no-cors' })
      .then(function () {
        setStatus('saved', 'Yuborildi');
        addRow(code, format, quantity, type);
        done();
      })
      .catch(function () {
        setStatus('error', 'Xatolik: internetni tekshiring');
        done();
      });
  }

  function addRow(code, format, quantity, type) {
    if (count === 0) logEl.innerHTML = '';
    count++;
    countEl.textContent = count + " ta kod";

    const row = document.createElement('div');
    row.className = 'row';
    const time = new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    row.innerHTML =
      '<span class="code">' + escapeHtml(code) + ' × ' + quantity + '</span>' +
      '<span class="meta">' + time + '<span class="tag ' + type + '">' + (type === 'kirim' ? 'Kirim' : 'Chiqim') + '</span></span>';
    logEl.prepend(row);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- Fanarqi (flash) ----
  torchBtn.addEventListener('click', function () {
    if (!html5QrCode || !torchSupported) return;
    torchOn = !torchOn;
    html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
      .then(function () {
        torchBtn.classList.toggle('on', torchOn);
      })
      .catch(function () {
        torchOn = !torchOn; // muvaffaqiyatsiz bo'lsa holatni qaytaramiz
      });
  });

  // ---- Skanerni ishga tushirish ----
  let lastCode = "";
  let lastTime = 0;

  function onScanSuccess(decodedText, decodedResult) {
    if (sheetOpen) return;
    const now = Date.now();
    if (decodedText === lastCode && now - lastTime < 2000) return;
    lastCode = decodedText;
    lastTime = now;

    const format = (decodedResult && decodedResult.result && decodedResult.result.format)
      ? decodedResult.result.format.formatName
      : "";

    pendingCode = decodedText;
    pendingFormat = format;
    openSheet();
  }

  function onScanError() { /* freym sayin xato normal, e'tiborsiz qoldiramiz */ }

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 230, height: 230 } },
    onScanSuccess,
    onScanError
  ).then(function () {
    // Fanarqi qo'llab-quvvatlanadimi tekshiramiz
    try {
      const capabilities = html5QrCode.getRunningTrackCapabilities();
      if (capabilities && capabilities.torch) {
        torchSupported = true;
        torchBtn.classList.remove('hidden');
      }
    } catch (e) { /* qo'llab-quvvatlanmasa jim o'tamiz */ }
  }).catch(function (err) {
    setStatus('error', 'Kameraga ruxsat berilmadi');
  });
</script>
</body>
</html>
