<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Skaner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg: #0B0E12;
    --surface: #12161C;
    --line: #232A33;
    --text: #EDF1F5;
    --muted: #7C8794;
    --laser: #33E6A0;
    --error: #F0664D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .top h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .top .count {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .viewfinder {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    aspect-ratio: 3 / 4;
  }
  #reader { width: 100% !important; height: 100% !important; }
  #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
  #reader__dashboard_section_csr button {
    background: var(--surface) !important;
    color: var(--text) !important;
    border: 1px solid var(--line) !important;
    border-radius: 10px !important;
    padding: 10px 14px !important;
    font-size: 14px !important;
  }
  #reader__scan_region { background: transparent !important; }
  #reader__dashboard { background: var(--surface) !important; color: var(--muted) !important; }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--laser);
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
  }
  .corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  .status {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 22px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status.saving .dot { background: #E8B93F; }
  .status.saved .dot { background: var(--laser); }
  .status.error .dot { background: var(--error); }
  .status.saved span.msg { color: var(--text); }

  .history { margin-top: 22px; }
  .history h2 {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row .code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .meta {
    font-size: 11.5px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .empty {
    color: var(--muted);
    font-size: 13.5px;
    padding: 10px 0;
  }

  .setup-warning {
    background: #2A1414;
    border: 1px solid #4A2020;
    color: #F0A090;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .setup-warning code {
    background: #1A0D0D;
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Skaner</h1>
      <span class="count" id="count">0 ta kod</span>
    </div>

    <div id="setupWarning"></div>

    <div class="viewfinder">
      <div id="reader"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>

    <div class="status" id="status">
      <div class="dot"></div>
      <span class="msg">Kodni ramka ichiga tuting</span>
    </div>

    <div class="history">
      <h2>So'nggi skanerlar</h2>
      <div id="log"><div class="empty">Hali hech narsa skanerlanmadi</div></div>
    </div>
  </div>

<script>
  // ====== SHUNI O'ZGARTIRING ======
  // Apps Script'ni Deploy qilgandan keyin olgan /exec havolangizni shu yerga qo'ying
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzE5qF4vST5KKlwOIM46p_qFlnJjR9sxcSf8jTvGt4VT6aP32HDqLDP0_5pygBMr_RX0Q/exec";
  // =================================

  let lastCode = "";
  let lastTime = 0;
  let count = 0;

  const statusEl = document.getElementById('status');
  const statusMsg = statusEl.querySelector('.msg');
  const logEl = document.getElementById('log');
  const countEl = document.getElementById('count');

  if (APPS_SCRIPT_URL.indexOf('YOUR_APPS_SCRIPT') !== -1) {
    document.getElementById('setupWarning').innerHTML =
      '<div class="setup-warning">Sozlash tugallanmagan: index.html faylida <code>APPS_SCRIPT_URL</code> qiymatini o\'zingizning Apps Script /exec havolangizga almashtiring.</div>';
  }

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusMsg.textContent = text;
  }

  function onScanSuccess(decodedText, decodedResult) {
    const now = Date.now();
    if (decodedText === lastCode && now - lastTime < 3000) return;
    lastCode = decodedText;
    lastTime = now;

    const format = (decodedResult && decodedResult.result && decodedResult.result.format)
      ? decodedResult.result.format.formatName
      : "";

    setStatus('saving', 'Saqlanmoqda...');
    sendToSheet(decodedText, format);
  }

  function sendToSheet(code, format) {
    // Apps Script CORS bilan cheklangan bo'lgani uchun "no-cors" rejimida
    // yuboramiz: so'rov yetib boradi, lekin javobni o'qiy olmaymiz.
    // Shuning uchun natijani optimistik tarzda "saqlandi" deb ko'rsatamiz.
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ code: code, format: format })
    })
    .then(function() {
      setStatus('saved', 'Saqlandi');
      addRow(code, format);
    })
    .catch(function(err) {
      setStatus('error', 'Xatolik: internetni tekshiring');
    });
  }

  function addRow(code, format) {
    if (count === 0) logEl.innerHTML = '';
    count++;
    countEl.textContent = count + " ta kod";

    const row = document.createElement('div');
    row.className = 'row';
    const time = new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    row.innerHTML =
      '<span class="code">' + escapeHtml(code) + '</span>' +
      '<span class="meta">' + time + (format ? ' · ' + format : '') + '</span>';
    logEl.prepend(row);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function onScanError() { /* freym sayin xato normal, e'tiborsiz qoldiramiz */ }

  const scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: { width: 230, height: 230 }, rememberLastUsedCamera: true },
    false
  );
  scanner.render(onScanSuccess, onScanError);
</script>
</body>
</html>
